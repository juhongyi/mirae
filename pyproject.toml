[project]
name = "mirae"
version = "0.0.0"
description = "DesignHub contributor pipeline automation PoC"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "n8n/tests"]
addopts = "-ra"
