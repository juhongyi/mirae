name: mirae

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    build:
      context: .
      dockerfile: n8n/Dockerfile
    environment:
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=admin@admin.com
      - N8N_INSTANCE_OWNER_FIRST_NAME=admin
      - N8N_INSTANCE_OWNER_LAST_NAME=admin
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=$$2y$$10$$DB2udtFcyrZrJh8uaYzNYeh9ZWuM5La72qrlNbUEm.toXG4sMJi2a
      - N8N_MCP_MANAGED_BY_ENV=true
      - N8N_MCP_ACCESS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      - NODE_FUNCTION_ALLOW_EXTERNAL=@resvg/resvg-js
      - GENERIC_TIMEZONE=Asia/Seoul
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy

volumes:
  n8n-data:
