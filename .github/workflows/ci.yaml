name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --all-packages --all-groups
      - run: uv run ruff check .
      - env:
          PYTHONPATH: api/src
        run: uv run pytest

  n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Temporary: remove this guard once workflow files are added.
      - if: ${{ hashFiles('n8n/workflows/**/*.ts') != '' }}
        run: pnpm check && git diff --exit-code
      # Temporary: remove this guard once workflow files are added.
      - if: ${{ hashFiles('n8n/workflows/**/*.ts') != '' }}
        run: pnpm validate
      # Temporary: remove this guard once workflow files are added.
      - if: ${{ hashFiles('n8n/tests/**/*.ts') != '' }}
        run: pnpm test:workflows
